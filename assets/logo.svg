    <line x1="34" y1="84" x2="34" y2="46"/>
    <line x1="50" y1="88" x2="50" y2="42"/>
    <line x1="66" y1="84" x2="66" y2="46"/>
    <line x1="82" y1="88" x2="82" y2="42"/>
  </g>
  <line x1="24" y1="88" x2="92" y2="42" stroke="#34D399" stroke-width="7" stroke-linecap="round"/>
</svg>
